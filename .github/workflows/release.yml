name: Build Killer Edition Release

on:
  workflow_dispatch:
  push:
    paths:
      - "VERSION"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with LFS content
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 0

      - name: Verify LFS files are materialized
        shell: bash
        run: |
          set -euo pipefail
          test -f Server/data/cache/main_file_cache.dat2
          if head -n 1 Server/data/cache/main_file_cache.dat2 | grep -q 'version https://git-lfs.github.com/spec/v1'; then
            echo "Cache is still an LFS pointer."
            exit 1
          fi

      - name: Set up Java 11 for upstream build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          cache-dependency-path: Server/pom.xml

      - name: Restore incremental server build
        uses: actions/cache@v4
        with:
          path: Server/target
          key: server-target-${{ runner.os }}-${{ hashFiles('Server/pom.xml') }}-${{ github.sha }}
          restore-keys: |
            server-target-${{ runner.os }}-${{ hashFiles('Server/pom.xml') }}-

      - name: Build server JAR
        working-directory: Server
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mvnw
          ./mvnw package -Dmaven.test.skip=true
          JAR="$(ls -1t target/*-jar-with-dependencies.jar | head -1)"
          cp "$JAR" server.jar
          test -s server.jar

      - name: Build self-updater helper
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Tools/Updater/build
          mkdir -p Tools/Updater/build
          javac -encoding UTF-8 -d Tools/Updater/build Tools/Updater/src/killer/updater/KillerUpdater.java
          jar --create --file Tools/Updater/KillerUpdater.jar --main-class killer.updater.KillerUpdater -C Tools/Updater/build killer
          test -s Tools/Updater/KillerUpdater.jar
          rm -rf Tools/Updater/build

      - name: Build release ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '\r\n ' < VERSION)"
          TAG="v$VERSION"
          NAME="2009scape-Killer-Edition_v$VERSION.zip"
          STAGE="$RUNNER_TEMP/2009scape-Killer-Edition"

          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          rsync -a ./ "$STAGE/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.runtime/' \
            --exclude='Server/target/' \
            --exclude='Server/hasRan.txt'

          test -s "$STAGE/Server/server.jar"
          test -s "$STAGE/Server/data/cache/main_file_cache.dat2"

          cd "$RUNNER_TEMP"
          7z a -tzip -mx=1 -mmt=on "$NAME" "2009scape-Killer-Edition" >/dev/null

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "path=$RUNNER_TEMP/$NAME" >> "$GITHUB_OUTPUT"

          MANIFEST="$RUNNER_TEMP/update-manifest.properties"
          BASE_URL="https://github.com/KillerInc/2009scape-Killer-Edition/releases/download/$TAG"

          sha256_file() {
            sha256sum "$1" | awk '{print $1}'
          }

          {
            echo "version=$VERSION"
            echo "file.count=5"
            echo "file.0.path=Server/server.jar"
            echo "file.0.sha256=$(sha256_file "$GITHUB_WORKSPACE/Server/server.jar")"
            echo "file.0.url=$BASE_URL/server.jar"
            echo "file.1.path=server-gui.bat"
            echo "file.1.sha256=$(sha256_file "$GITHUB_WORKSPACE/server-gui.bat")"
            echo "file.1.url=$BASE_URL/server-gui.bat"
            echo "file.2.path=server.bat"
            echo "file.2.sha256=$(sha256_file "$GITHUB_WORKSPACE/server.bat")"
            echo "file.2.url=$BASE_URL/server.bat"
            echo "file.3.path=setup.bat"
            echo "file.3.sha256=$(sha256_file "$GITHUB_WORKSPACE/setup.bat")"
            echo "file.3.url=$BASE_URL/setup.bat"
            echo "file.4.path=VERSION"
            echo "file.4.sha256=$(sha256_file "$GITHUB_WORKSPACE/VERSION")"
            echo "file.4.url=$BASE_URL/VERSION"
            echo "updater.sha256=$(sha256_file "$GITHUB_WORKSPACE/Tools/Updater/KillerUpdater.jar")"
            echo "updater.url=$BASE_URL/KillerUpdater.jar"
          } > "$MANIFEST"

          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"
          echo "updater=$GITHUB_WORKSPACE/Tools/Updater/KillerUpdater.jar" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
          ZIP_PATH: ${{ steps.package.outputs.path }}
          ZIP_NAME: ${{ steps.package.outputs.name }}
          MANIFEST_PATH: ${{ steps.package.outputs.manifest }}
          UPDATER_PATH: ${{ steps.package.outputs.updater }}
        shell: bash
        run: |
          set -euo pipefail

          NOTES="$(cat <<EOF
          2009Scape Killer Edition $TAG

          Windows quick start:
          1. Download $ZIP_NAME
          2. Extract it
          3. Run setup.bat once
          4. Run server-gui.bat for the graphical server controller, or server.bat for console-only mode.

          This package includes the materialized RuneScape cache and a prebuilt server.jar with the lightweight Server Control GUI and self-patcher built in.
          Existing Killer Edition installs can update from the Server Control GUI without downloading the full ZIP.
          Git and Git LFS are not required when using this release ZIP.
          setup.bat downloads a private Temurin JDK 11 runtime into .runtime and does not change system Java.
          EOF
          )"

          ASSETS=(
            "$ZIP_PATH"
            "$MANIFEST_PATH"
            "$UPDATER_PATH"
            "Server/server.jar"
            "server-gui.bat"
            "server.bat"
            "setup.bat"
            "VERSION"
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" \
              --title "2009Scape Killer Edition $TAG" \
              --notes "$NOTES"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "${GITHUB_SHA}" \
              --title "2009Scape Killer Edition $TAG" \
              --notes "$NOTES"
          fi
