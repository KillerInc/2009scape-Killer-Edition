name: Build Killer Edition Release

on:
  workflow_dispatch:
  # Normal pushes never build a release. Advancing the dedicated release branch is the manual release trigger.
  push:
    branches:
      - release

permissions:
  contents: write

concurrency:
  group: killer-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with LFS content
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 0

      - name: Verify LFS files are materialized
        shell: bash
        run: |
          set -euo pipefail
          test -f Server/data/cache/main_file_cache.dat2
          if head -n 1 Server/data/cache/main_file_cache.dat2 | grep -q 'version https://git-lfs.github.com/spec/v1'; then
            echo "Cache is still an LFS pointer."
            exit 1
          fi

      - name: Set up Java 11 for upstream build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          cache-dependency-path: Server/pom.xml

      - name: Restore incremental server build
        uses: actions/cache@v5
        with:
          path: Server/target
          key: server-target-${{ runner.os }}-${{ hashFiles('Server/pom.xml') }}-${{ github.sha }}
          restore-keys: |
            server-target-${{ runner.os }}-${{ hashFiles('Server/pom.xml') }}-

      - name: Build server JAR
        working-directory: Server
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mvnw
          ./mvnw package -Dmaven.test.skip=true
          JAR="$(ls -1t target/*-jar-with-dependencies.jar | head -1)"
          cp "$JAR" server.jar
          test -s server.jar

      - name: Build self-updater helper
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Tools/Updater/build
          mkdir -p Tools/Updater/build
          javac -encoding UTF-8 -d Tools/Updater/build Tools/Updater/src/killer/updater/KillerUpdater.java
          jar --create --file Tools/Updater/KillerUpdater.jar --main-class killer.updater.KillerUpdater -C Tools/Updater/build killer
          test -s Tools/Updater/KillerUpdater.jar
          rm -rf Tools/Updater/build

      - name: Build component archives and clean releases
        id: package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '\r\n ' < VERSION)"
          TAG="v$VERSION"
          BASE_URL="https://github.com/KillerInc/2009scape-Killer-Edition/releases/download/$TAG"

          WORK="$RUNNER_TEMP/killer-package"
          FULL="$WORK/2009scape-Killer-Edition"
          COMPONENTS="$WORK/components"
          MANIFEST="$WORK/update-manifest.properties"
          ZIP_NAME="2009scape-Killer-Edition_v$VERSION.zip"
          SEVEN_NAME="2009scape-Killer-Edition_v$VERSION.7z"
          ZIP_PATH="$RUNNER_TEMP/$ZIP_NAME"
          SEVEN_PATH="$RUNNER_TEMP/$SEVEN_NAME"

          rm -rf "$WORK"
          mkdir -p "$FULL/packages" "$FULL/Server/worldprops" "$COMPONENTS"

          make_archive() {
            local archive="$1"
            local stage="$2"
            rm -f "$archive"
            (
              cd "$stage"
              7z a -tzip -mx=1 -mmt=on "$archive" . >/dev/null
            )
            test -s "$archive"
          }

          sha256_file() {
            sha256sum "$1" | awk '{print $1}'
          }

          # Core runtime: compiled server + launchers + updater only.
          CORE_STAGE="$WORK/core-stage"
          mkdir -p "$CORE_STAGE/Server" "$CORE_STAGE/Tools/Updater"
          cp Server/server.jar "$CORE_STAGE/Server/server.jar"
          cp server.bat "$CORE_STAGE/server.bat"
          cp server-gui.bat "$CORE_STAGE/server-gui.bat"
          cp run-server.bat "$CORE_STAGE/run-server.bat"
          cp VERSION "$CORE_STAGE/VERSION"
          cp Tools/Updater/KillerUpdater.jar "$CORE_STAGE/Tools/Updater/KillerUpdater.jar"
          make_archive "$COMPONENTS/Core.archive" "$CORE_STAGE"

          # Runtime data groups. These are intentionally independent so patching
          # downloads only the group whose SHA-256 changed.
          CONFIG_STAGE="$WORK/config-stage"
          mkdir -p "$CONFIG_STAGE/Server/data"
          cp -a Server/data/configs "$CONFIG_STAGE/Server/data/configs"
          make_archive "$COMPONENTS/Configs.archive" "$CONFIG_STAGE"

          BOTS_STAGE="$WORK/bots-stage"
          mkdir -p "$BOTS_STAGE/Server/data"
          cp -a Server/data/botdata "$BOTS_STAGE/Server/data/botdata"
          make_archive "$COMPONENTS/Bots.archive" "$BOTS_STAGE"

          CACHE_STAGE="$WORK/cache-stage"
          mkdir -p "$CACHE_STAGE/Server/data"
          cp -a Server/data/cache "$CACHE_STAGE/Server/data/cache"
          make_archive "$COMPONENTS/Cache.archive" "$CACHE_STAGE"

          CORE_SHA="$(sha256_file "$COMPONENTS/Core.archive")"
          CONFIG_SHA="$(sha256_file "$COMPONENTS/Configs.archive")"
          BOTS_SHA="$(sha256_file "$COMPONENTS/Bots.archive")"
          CACHE_SHA="$(sha256_file "$COMPONENTS/Cache.archive")"

          cat > "$MANIFEST" <<EOF
          version=$VERSION
          component.count=4
          component.0.name=Core
          component.0.file=packages/Core.archive
          component.0.sha256=$CORE_SHA
          component.0.url=$BASE_URL/Core.archive
          component.0.clean=
          component.0.backup=true
          component.1.name=Configs
          component.1.file=packages/Configs.archive
          component.1.sha256=$CONFIG_SHA
          component.1.url=$BASE_URL/Configs.archive
          component.1.clean=Server/data/configs
          component.1.backup=true
          component.2.name=Bots
          component.2.file=packages/Bots.archive
          component.2.sha256=$BOTS_SHA
          component.2.url=$BASE_URL/Bots.archive
          component.2.clean=Server/data/botdata
          component.2.backup=true
          component.3.name=Cache
          component.3.file=packages/Cache.archive
          component.3.sha256=$CACHE_SHA
          component.3.url=$BASE_URL/Cache.archive
          component.3.clean=Server/data/cache
          component.3.backup=false
          EOF

          # Fresh-install shell contains only installer/user-facing files plus
          # the four archives. Source, dumps, tests, build tooling and dev tools
          # are deliberately not distributed.
          cp setup.bat "$FULL/setup.bat"
          cp README.md "$FULL/README.md"
          cp LICENSE "$FULL/LICENSE"
          cp Server/worldprops/default.conf "$FULL/Server/worldprops/default.conf"
          cp "$MANIFEST" "$FULL/update-manifest.properties"
          cp "$COMPONENTS/"*.archive "$FULL/packages/"

          cd "$WORK"
          7z a -tzip -mx=0 -mmt=on "$ZIP_PATH" "2009scape-Killer-Edition" >/dev/null
          7z a -t7z -mx=1 -mmt=on "$SEVEN_PATH" "2009scape-Killer-Edition" >/dev/null

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "seven_name=$SEVEN_NAME" >> "$GITHUB_OUTPUT"
          echo "seven_path=$SEVEN_PATH" >> "$GITHUB_OUTPUT"
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"
          echo "core=$COMPONENTS/Core.archive" >> "$GITHUB_OUTPUT"
          echo "configs=$COMPONENTS/Configs.archive" >> "$GITHUB_OUTPUT"
          echo "bots=$COMPONENTS/Bots.archive" >> "$GITHUB_OUTPUT"
          echo "cache=$COMPONENTS/Cache.archive" >> "$GITHUB_OUTPUT"

          echo "Clean release contents:"
          find "$FULL" -type f -printf '%P\n' | sort
          echo "File count: $(find "$FULL" -type f | wc -l)"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
          SEVEN_PATH: ${{ steps.package.outputs.seven_path }}
          SEVEN_NAME: ${{ steps.package.outputs.seven_name }}
          MANIFEST_PATH: ${{ steps.package.outputs.manifest }}
          CORE_PATH: ${{ steps.package.outputs.core }}
          CONFIGS_PATH: ${{ steps.package.outputs.configs }}
          BOTS_PATH: ${{ steps.package.outputs.bots }}
          CACHE_PATH: ${{ steps.package.outputs.cache }}
        shell: bash
        run: |
          set -euo pipefail

          NOTES="$(cat <<EOF
          2009Scape Killer Edition $TAG

          Windows quick start:
          1. Recommended: download $SEVEN_NAME and extract it with 7-Zip.
             The normal $ZIP_NAME is also available.
          2. Run setup.bat once.
          3. Run server-gui.bat for the graphical server controller, or server.bat for console-only mode.

          The fresh-install archive contains only runtime files. Development source,
          dumps, tests, Maven files, Docker files and cache-editing tools are excluded.

          Runtime data is split into independently hashed Core, Configs, Bots and Cache
          component archives. The Server Control updater compares those SHA-256 hashes
          and downloads only components that changed.

          Player saves, worldprops, logs and the private .runtime Java installation are
          never replaced by normal component updates.
          EOF
          )"

          ASSETS=(
            "$ZIP_PATH"
            "$SEVEN_PATH"
            "$MANIFEST_PATH"
            "$CORE_PATH"
            "$CONFIGS_PATH"
            "$BOTS_PATH"
            "$CACHE_PATH"
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" \
              --title "2009Scape Killer Edition $TAG" \
              --notes "$NOTES"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "${GITHUB_SHA}" \
              --title "2009Scape Killer Edition $TAG" \
              --notes "$NOTES"
          fi
